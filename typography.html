<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width">

    <title>My Color Card</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


    <style>
        body{
            background-color: lightskyblue;
            font-family: cursive;
            text-align: center;
            padding: 30px;
        }
        h2{
            color: aquamarine;
            margin-top: 60px;
        }
        abbr{
            color: chocolate;
            background-color: beige;
            cursor: help;
        }
        blockquote{
            color: olivedrab;
            padding-left: 15px;
            text-align: left;
            font-style: italic;
            display: inline-block;
        }
        hr{
            border-color: darkred;
        }



    </style>




</head>
<body>
<p class="display-1">My Food Diary</p>
<p class="display-2">My Top Dishes</p>
<p class="display-3">Fun Food Facts</p>
<p class="display-4">Food Guide<small>by gautam</small></p>
<hr>

<h2>Cookie style</h2>
<p>My favoirate way to cook with family is a good old <abbr title="Barbeque">BBQ</abbr> on a sunny day.</p>

<h2>Food quote</h2>
<blockquote>
    <p>First we eat, then we do everything else.</p>
    <p>-gautam the designer</p>
    



</blockquote>


</body>
</html>

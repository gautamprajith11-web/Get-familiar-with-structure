<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width">

    <title>My Color Card</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body{
            background-color: darkviolet;
            font-family: 'Times New Roman', Times, serif;
        }
        .jumbotron




    </style>
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Welcom to the lab. Here are the expiriments running,
            the discoveries made, and how far each research project has come.
            </p>
            <button class="btn btn-primary">chemistry</button>
            <button class="btn btn-success">math</button>
            <button class="btn btn-warning">chemistry</button>
            <button class="btn btn-danger">economics</button>
        </div>
    </div>
    <div class="container">
        <h2 class="section-title"></h2>
        <p>chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 85%;">85%</div>
            
        </div>

        <p>biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 57%;">57%</div>
            <p>biology</p>
        </div>

        <p>physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 34%;">34%</div>
            <p>physics</p>
        </div>

        <p>astranomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 72%;">72%</div>
            <p>astranomy</p>
        </div>




    </div>



</body>
</html>

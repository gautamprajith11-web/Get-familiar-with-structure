<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width">

    <title>My Superhero Car</title>

    <style>
        body{
            background-color: darkblue;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        .hero-name{
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px green;
        }
        .tagline{
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: aqua;
        }
        .power{
            font-weight: bold;
            color: lightgreen;
        }
        .weakness{
            text-decoration: line-through;
            color: grey;
        }



    </style>

</head>

<body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label">Superpowers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can teleport to different places</p>

    <h2 class="label">Weaknesses</h2>
    <p class="weakness">Maths homework</p>
    <p class="weakness">Broccoli</p>




</body>
</html>
